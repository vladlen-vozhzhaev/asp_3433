name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: 

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore
        run: dotnet restore
        
      - name: Publish
        run: dotnet publish -c Release -r linux-x64 --self-contained false -o ./publish
        
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{secrets.SSH_PORT}} -H ${{secrets.SSH_HOST}} >> ~/.ssh/known_hosts 2>/dev/null
        
      - name: Debug SSH key
        run: |
          wc -c ~/.ssh/id_ed25519
          head -n 1 ~/.ssh/id_ed25519
          tail -n 1 ~/.ssh/id_ed25519
          wc -l ~/.ssh/id_ed25519
          ssh -vv -p ${{secrets.SSH_PORT}} \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accpt-new \
            ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} \
            "whoami" || true
      
      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{secrets.SSH_PORT}} -i ~/.ssh/id_ed25519" \
            ./publish/ ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}}:/srv/webapp/

      - name: Restart service
        run: |
          ssh -p ${{secrets.SSH_PORT}} -i ~/.ssh/id_ed25519 \
            ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} \
            "sudo systemctl restart webapp"